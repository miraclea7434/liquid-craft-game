name: Auto Build Play Store AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode Keystore
        run: |
          mkdir -p app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release-key.jks

      - name: Auto-Generate Complete Native Android Project
        run: |
          mkdir -p app/src/main/java/com/liquidcraft/colormix
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          if [ -f "index.html" ]; then
            cp index.html app/src/main/assets/index.html
          fi

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://android.com"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#1E88E5" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M54,28c-14.36,0 -26,11.64 -26,26s11.64,26 26,26 26,-11.64 26,-26S68.36,28 54,28z"/>
          </vector>
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "LiquidCraft"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.liquidcraft.colormix"
              compileSdk = 36
              defaultConfig {
                  applicationId = "com.liquidcraft.colormix"
                  minSdk = 24
                  targetSdk = 36
                  versionCode = 1
                  versionName = "1.0.0"
              }
              signingConfigs {
                  create("release") {
                      storeFile = file("release-key.jks")
                      storePassword = System.getenv("KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("KEY_ALIAS")
                      keyPassword = System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("release")
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("com.google.android.gms:play-services-ads:23.3.0")
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Liquid Craft Color Mix</string>
          </resources>
          EOF

                  NS_URL="http://schemas.android."
          NS_URL="${NS_URL}com/apk/res/android"
          cat << EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="$NS_URL">
          
                  
                              
                    
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">
                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-4400130263411681~2376450154"/>
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
      
    

          cat << 'EOF' > app/src/main/java/com/liquidcraft/colormix/MainActivity.kt
          package com.liquidcraft.colormix

          import android.annotation.SuppressLint
          import android.os.Bundle
          import android.view.Gravity
          import android.webkit.JavascriptInterface
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.FrameLayout
          import androidx.activity.OnBackPressedCallback
          import androidx.appcompat.app.AppCompatActivity
          import com.google.android.gms.ads.AdRequest
          import com.google.android.gms.ads.AdSize
          import com.google.android.gms.ads.AdView
          import com.google.android.gms.ads.FullScreenContentCallback
          import com.google.android.gms.ads.LoadAdError
          import com.google.android.gms.ads.MobileAds
          import com.google.android.gms.ads.interstitial.InterstitialAd
          import com.google.android.gms.ads.interstitial.InterstitialAdLoadCallback
          import com.google.android.gms.ads.rewarded.RewardedAd
          import com.google.android.gms.ads.rewarded.RewardedAdLoadCallback

          class MainActivity : AppCompatActivity() {
              private var mInterstitialAd: InterstitialAd? = null
              private var mRewardedAd: RewardedAd? = null

              private val BANNER_AD_ID = "ca-app-pub-4400130263411681/7405537295"
              private val INTERSTITIAL_AD_ID = "ca-app-pub-4400130263411681/1852711906"
              private val REWARDED_AD_ID = "ca-app-pub-4400130263411681/7400190877"

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  MobileAds.initialize(this) {}
                  loadInterstitialAd()
                  loadRewardedAd()

                  val rootLayout = FrameLayout(this)
                  val webView = WebView(this).apply {
                      settings.javaScriptEnabled = true
                      settings.domStorageEnabled = true
                      settings.allowFileAccess = true
                      settings.cacheMode = WebSettings.LOAD_DEFAULT
                      webViewClient = WebViewClient()
                      webChromeClient = WebChromeClient()
                      addJavascriptInterface(AdBridge(), "NativeAndroidAds")
                      loadUrl("file:///android_asset/index.html")
                  }
                  rootLayout.addView(webView, FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT))

                  val adView = AdView(this).apply {
                      setAdSize(AdSize.BANNER)
                      adUnitId = BANNER_AD_ID
                      loadAd(AdRequest.Builder().build())
                  }
                  val bannerParams = FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.WRAP_CONTENT, FrameLayout.LayoutParams.WRAP_CONTENT
                  ).apply { gravity = Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL }
                  rootLayout.addView(adView, bannerParams)

                  setContentView(rootLayout)
                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          webView.evaluateJavascript("if(typeof showExitModal==='function')showExitModal();else finish();", null)
                      }
                  })
              }

              private fun loadInterstitialAd() {
                  InterstitialAd.load(this, INTERSTITIAL_AD_ID, AdRequest.Builder().build(),
                      object : InterstitialAdLoadCallback() {
                          override fun onAdLoaded(ad: InterstitialAd) { mInterstitialAd = ad }
                          override fun onAdFailedToLoad(err: LoadAdError) { mInterstitialAd = null }
                      })
              }

              private fun loadRewardedAd() {
                  RewardedAd.load(this, REWARDED_AD_ID, AdRequest.Builder().build(),
                      object : RewardedAdLoadCallback() {
                                                override fun onAdLoaded(ad: RewardedAd) { mRewardedAd = ad }
                          override fun onAdFailedToLoad(err: LoadAdError) { mRewardedAd = null }
                      })
              }

              inner class AdBridge {
                  @JavascriptInterface
                  fun showInterstitial() {
                      runOnUiThread {
                          mInterstitialAd?.fullScreenContentCallback = object : FullScreenContentCallback() {
                              override fun onAdDismissedFullScreenContent() { mInterstitialAd = null; loadInterstitialAd() }
                          }
                          if (mInterstitialAd != null) mInterstitialAd?.show(this@MainActivity)
                      }
                  }

                  @JavascriptInterface
                  fun showRewarded(rewardType: String) {
                      runOnUiThread {
                          if (mRewardedAd != null) {
                              mRewardedAd?.show(this@MainActivity) {
                                  runOnUiThread {
                                      val wv = (window.decorView.findViewById<FrameLayout>(android.R.id.content).getChildAt(0) as? FrameLayout)?.getChildAt(0) as? WebView
                                      wv?.evaluateJavascript("if(window.onNativeReward)window.onNativeReward('$rewardType');", null)
                                  }
                              }
                              mRewardedAd = null; loadRewardedAd()
                          }
                      }
                  }
              }
          }
          EOF

      - name: Setup Gradle Wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed Release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: playstore-signed-aab
          path: app/build/outputs/bundle/release/app-release.aab
          
