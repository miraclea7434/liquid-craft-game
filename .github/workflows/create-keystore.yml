name: Create Keystore
on:
  workflow_dispatch:

jobs:
  generate-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate JKS Keystore
        run: |
          keytool -genkey -v \
            -keystore release-key.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias my-key-alias \
            -storepass LiquidCraft2026 \
            -keypass LiquidCraft2026 \
            -dname "CN=LiquidCraft, OU=Dev, O=LiquidCraft, L=Hyderabad, S=Telangana, C=IN"

      - name: Upload Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-release-keystore
          path: release-key.jks
          
